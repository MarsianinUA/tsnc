# Build, unit tests, the smoke test and the negative and differential corpora on every v1 platform
# (requirements 9 and 10), the corpus also under GC stress and with the runtime built with
# AddressSanitizer.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows_amd64 }
          - { os: ubuntu-latest, target: linux_amd64 }
          - { os: macos-latest, target: darwin_arm64 }
          - { os: macos-26-intel, target: darwin_amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # dev-2026-09 is the build of commit a2fb372, the Odin the project pins (requirements 13). It
      # is the last Odin release for Intel Macs (Odin commit 75d06fc): a newer Odin on
      # macos-26-intel has to be built from source.
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-09

      - name: LLVM 20
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev

      # The macOS 26 images carry Homebrew's llvm@20. No brew install: Homebrew has no Intel
      # bottles since 6.0, and on macos-26-intel it would build LLVM from source.
      - name: LLVM 20
        if: runner.os == 'macOS'
        run: |
          lib="$(brew --prefix llvm@20)/lib/libLLVM-20.dylib"
          if [ ! -e "$lib" ]; then
            echo "::error::$lib is missing: the image no longer carries llvm@20"
            exit 1
          fi

      - name: Odin
        run: odin report

      - name: Compiler
        run: |
          mkdir dist
          odin build src -out:dist/tsnc.exe -o:speed -vet -strict-style

      - name: Runtime object
        run: odin build src/runtime -build-mode:obj -use-single-module -out:dist/tsnc_rt-${{ matrix.target }}.obj -vet -strict-style

      # What `tsnc build -sanitize:address` links in place of the object above.
      - name: Runtime object with ASan
        run: odin build src/runtime -build-mode:obj -use-single-module -sanitize:address -out:dist/tsnc_rt-${{ matrix.target }}-asan.obj -vet -strict-style

      # The case and width table generators run only by hand (docs/development.md), so CI checks that
      # they still compile.
      - name: Table generators
        run: |
          odin check src/runtime/str/tools -vet -strict-style
          odin check src/runtime/console/tools -vet -strict-style

      # The benchmarks run by hand (docs/development.md): timings on a shared runner say little.
      - name: Benchmark runner
        run: odin check bench/runner -vet -strict-style

      # Every test package: tests/<package> and tests/runtime/<package>. A failing package does not
      # stop the others, so one log shows every failure.
      - name: Unit tests
        run: |
          shopt -s nullglob
          failed=()
          for dir in tests/*/ tests/*/*/; do
            dir=${dir%/}
            files=("$dir"/*_test.odin)
            [ ${#files[@]} -gt 0 ] || continue
            name=${dir#tests/}
            echo "::group::odin test $dir"
            odin test "$dir" -out:"dist/${name//\//-}-tests.exe" -vet -strict-style || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::odin test failed: ${failed[*]}"
            exit 1
          fi

      - name: Smoke
        run: odin run tests/runner -out:dist/runner.exe -vet -strict-style -- smoke

      # Runs dist/tsnc.exe from the Compiler step over tests/negative/, so it needs no build of
      # its own.
      - name: Negative
        run: odin run tests/runner -out:dist/runner.exe -vet -strict-style -- negative

      # Node is the reference of the differential corpus and hosts its tsc gate (requirements 10).
      # The version is pinned rather than taken from the image: type stripping, which is what lets
      # `node test.ts` be a reference, arrived in Node 23.6.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/diff/package-lock.json

      - name: TypeScript
        run: npm ci
        working-directory: tests/diff

      # Builds and runs every program in tests/diff/src/, so it needs both the compiler and the runtime
      # object of the steps above.
      - name: Diff
        run: odin run tests/runner -out:dist/runner.exe -vet -strict-style -- diff

      # The same corpus with the collector in stress mode (docs/development.md), which the compiled
      # programs inherit from the runner: every allocation collects first and checks the heap
      # after, so a cell generated code still needs, kept where the collector does not look, fails
      # the run instead of a program much later.
      - name: Diff under GC stress
        env:
          TSNC_GC_STRESS: "1"
        run: odin run tests/runner -out:dist/runner.exe -vet -strict-style -- diff

      # Under ASan the collector poisons the heap a program may not touch: slot slack, freed cells
      # past their free list link, page tails and free pages (src/runtime/gc/heap.odin). The test
      # binary has no rt, whose __asan_default_options turns off the fake stack that hides
      # address-taken locals from the stack scan, so the variable does it here.
      #
      # On macOS Odin links with Xcode's clang, whose ASan runtime the LLVM 20 instrumentation cannot
      # link against, so ODIN_CLANG_PATH points it at the clang of Homebrew's llvm@20, the one tsnc
      # itself links an ASan build with there (src/link/link.odin).
      #
      # Both ASan steps skip the Intel Mac. Homebrew publishes no Intel bottles since September 2026,
      # so llvm@20 on that image is built from source, and an ASan program linked with it dies with
      # SIGILL before printing a line. CPython and Go keep ASan to the platforms whose toolchain
      # carries it too; the poisoning is the same code on every OS, and three images still run it.
      - name: GC tests under ASan
        if: matrix.target != 'darwin_amd64'
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=0
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export ODIN_CLANG_PATH="$(brew --prefix llvm@20)/bin/clang"
          fi
          odin test tests/runtime/gc -out:dist/runtime-gc-asan-tests.exe -vet -strict-style -sanitize:address

      # Stress mode as well: every allocation collects, so each freed cell is poisoned right away.
      - name: Diff under ASan
        if: matrix.target != 'darwin_amd64'
        env:
          TSNC_GC_STRESS: "1"
        run: odin run tests/runner -out:dist/runner.exe -vet -strict-style -- diff -sanitize:address
