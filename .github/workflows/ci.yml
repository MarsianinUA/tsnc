# Build, unit tests, the smoke test and the negative, differential and expected-output corpora on
# every v1 platform (requirements 9 and 10), the last two also under GC stress and with the runtime
# built with AddressSanitizer.
name: CI

# A change to the docs alone starts no run: nothing in them is built or tested.
on:
  push:
    branches: [main, dev]
    paths-ignore: [docs/**, "**.md", .claude/**]
  pull_request:
    paths-ignore: [docs/**, "**.md", .claude/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows_amd64 }
          - { os: ubuntu-latest, target: linux_amd64 }
          - { os: macos-latest, target: darwin_arm64 }
          - { os: macos-26-intel, target: darwin_amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # dev-2026-09 is the build of commit a2fb372, the Odin the project pins (requirements 13). It
      # is the last Odin release for Intel Macs (Odin commit 75d06fc): a newer Odin on
      # macos-26-intel has to be built from source.
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-09

      - name: LLVM 20
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev

      # The macOS 26 images carry Homebrew's llvm@20. No brew install: Homebrew has no Intel
      # bottles since 6.0, and on macos-26-intel it would build LLVM from source.
      - name: LLVM 20
        if: runner.os == 'macOS'
        run: |
          lib="$(brew --prefix llvm@20)/lib/libLLVM-20.dylib"
          if [ ! -e "$lib" ]; then
            echo "::error::$lib is missing: the image no longer carries llvm@20"
            exit 1
          fi

      - name: Odin
        run: odin report

      - name: Compiler
        run: |
          mkdir dist
          odin build src -out:dist/tsnc.exe -o:speed -vet -strict-style

      - name: Runtime object
        run: odin build src/runtime -build-mode:obj -use-single-module -o:speed -out:dist/tsnc_rt-${{ matrix.target }}.obj -vet -strict-style

      # What `tsnc build -sanitize:address` links in place of the object above. Not on macOS, where
      # the ASan runs are skipped (see "GC tests under ASan").
      - name: Runtime object with ASan
        if: runner.os != 'macOS'
        run: odin build src/runtime -build-mode:obj -use-single-module -o:speed -sanitize:address -out:dist/tsnc_rt-${{ matrix.target }}-asan.obj -vet -strict-style

      # The case and width table generators run only by hand (docs/development.md), so CI checks that
      # they still compile.
      - name: Table generators
        run: |
          odin check src/runtime/str/tools -vet -strict-style
          odin check src/runtime/console/tools -vet -strict-style

      # The benchmarks run by hand (docs/development.md): timings on a shared runner say little.
      - name: Benchmark runner
        run: odin check bench/runner -vet -strict-style

      # Built once for every step below. Each mode runs its programs on as many threads as the runner
      # has cores and reports every failure, so one log shows all of them.
      - name: Runner
        run: odin build tests/runner -out:dist/runner.exe -vet -strict-style

      # `odin test` on every package: tests/<package> and tests/runtime/<package>.
      - name: Unit tests
        run: dist/runner.exe unit

      - name: Smoke
        run: dist/runner.exe smoke

      # Runs `dist/tsnc.exe build` from the Compiler step over tests/negative/, so it needs no
      # build of its own: a program with a diagnostic never gets as far as linking.
      - name: Negative
        run: dist/runner.exe negative

      # Node is the reference of the differential corpus and hosts its tsc gate (requirements 10).
      # The version is pinned rather than taken from the image: type stripping, which is what lets
      # `node test.ts` be a reference, arrived in Node 23.6.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/diff/package-lock.json

      - name: TypeScript
        run: npm ci
        working-directory: tests/diff

      # Builds and runs every program in tests/diff/src/, so it needs both the compiler and the runtime
      # object of the steps above. Each build runs twice, the second time with the collector in
      # stress mode (docs/development.md): every allocation collects first and checks the heap
      # after, so a cell generated code still needs, kept where the collector does not look, fails
      # the run instead of a program much later.
      - name: Diff
        run: dist/runner.exe diff

      # The runtime failures of requirements 3.8, which Node cannot be the reference for: every
      # program in tests/expect/ is compared with the output its header states. It needs what Diff
      # needs, the gate included.
      - name: Expect
        run: dist/runner.exe expect

      # Under ASan the collector poisons the heap a program may not touch: slot slack, freed cells
      # past their free list link, page tails and free pages (src/runtime/gc/heap.odin). The test
      # binary has no rt, whose __asan_default_options turns off the fake stack that hides
      # address-taken locals from the stack scan, so the variable does it here.
      #
      # Both ASan steps run on Windows and Linux only, as CPython runs ASan on Linux only and
      # `go build -asan` exists only there. On macOS Xcode's clang cannot link the LLVM 20
      # instrumentation against Apple's ASan runtime (undefined ___asan_version_mismatch_check_v8).
      # Linked through Homebrew's llvm@20 instead, the program died with SIGILL on the Intel image
      # and hung on arm64 macOS 26, as llvm-project issue 200447 reports for a one-line C program.
      # The poisoning is the same code on every OS.
      - name: GC tests under ASan
        if: runner.os != 'macOS'
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=0
        run: odin test tests/runtime/gc -out:dist/runtime-gc-asan-tests.exe -vet -strict-style -sanitize:address -define:TSNC_EXPECT_ASAN=true

      # The runner runs an ASan build under stress alone: every allocation collects, so each freed
      # cell is poisoned right away.
      - name: Diff under ASan
        if: runner.os != 'macOS'
        run: dist/runner.exe diff -sanitize:address

      - name: Expect under ASan
        if: runner.os != 'macOS'
        run: dist/runner.exe expect -sanitize:address
